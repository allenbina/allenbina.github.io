<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='16' y='22' font-family='ui-monospace,monospace' font-size='18' font-weight='700' fill='%23ffd166' text-anchor='middle'%3Eab%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">allen bina</a>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>home</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>projects</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>about</a>
      <a href="{{ '/press/' | relative_url }}" {% if page.url contains '/press' %}class="active"{% endif %}>press</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="socials">
      <a href="https://github.com/allenbina">github</a>
      <a href="https://www.linkedin.com/in/allenbina">linkedin</a>
      <a href="https://github.com/allenbina/chatwire">chatwire</a>
      <a href="https://dsc.gg/chatwire">discord</a>
    </div>
    <p class="fineprint">
      © {{ 'now' | date: "%Y" }} Allen Bina. site is plain Jekyll, hosted on GitHub Pages.
      press materials at <a href="https://github.com/allenbina/press">github.com/allenbina/press</a>.
    </p>
  </div>
</footer>

</body>
</html>
